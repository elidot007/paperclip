# systemd drop-in for a Paperclip service that supports hot-restart adoption.
#
# Install:
#   install -Dm644 doc/systemd/paperclip-hot-restart.conf \
#     ~/.config/systemd/user/<unit>.service.d/hot-restart.conf
#   systemctl --user daemon-reload
#
# Why this is required
# --------------------
# The adoption protocol above only works if the restarted server leaves the
# in-flight children alone. The systemd default for a service unit is
# `KillMode=control-group`, which sends SIGTERM to EVERY process in the unit's
# cgroup — the children die before the new server ever starts, and the
# shutdown snapshot has nothing left to adopt. A file-backed output channel
# does not help here: it stops the child dying from a closed pipe, not from an
# explicit SIGTERM.
#
# `KillMode=process` signals only the main server process. Children are
# reparented to the user manager and survive; the new server re-attaches to
# them from the log channel descriptors.
#
# The trade-off
# -------------
# With `KillMode=process`, a server that dies without a clean shutdown never
# reaps its children — systemd will not SIGKILL leftovers, and a child whose
# run row was already deleted leaks. The startup orphan reaper covers runs the
# database still knows about. If you would rather trade adoption for guaranteed
# cleanup, use `KillMode=mixed` instead: SIGTERM still goes only to the main
# process, but SIGKILL follows to the rest of the cgroup after
# `TimeoutStopSec`. That is strictly better than the default for adoption —
# it gives the old server the whole timeout to exit cleanly — but it does kill
# runs that outlive the timeout.
#
# Verify the unit picked it up (the next restart is when it takes effect):
#   systemctl --user show <unit>.service -p KillMode

[Service]
KillMode=process
